<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html" />
    <title>Landing Page</title>
    <style>
        * {
            font-family: sans-serif;
        }

        #tray, p {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div id="tray">
        <h1>Integração com a Tray</h1>
        <p>
            <a href="https://loja-s.tray.com.br/auth.php?response_type=code&consumer_key=636113d7eb2056b3c83d8446730c974e1f0b114099373970a3060deb167d1020&callback=https://partner-tech.github.io">
                Clique aqui para autorizar a integração com a Tray
            </a>
        </p>
    </div>

    <script>
        const tray = document.getElementById('tray');

        const urlParams = new URLSearchParams(window.location.search);

        let query = '';

        for (const [key, value] of urlParams.entries())
        {
            query += `${key}=${value}<br />`;
        }

        tray.innerHTML = query;

    </script>

</body>
</html>
